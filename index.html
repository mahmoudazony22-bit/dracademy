<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>Dr Academy</title></head><body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
  :root{--ink:#1B2340;--ink-soft:#333B58;--paper:#F7F4EC;--card:#FFFFFF;--gold:#C99A3B;--gold-soft:#F1E3C3;--teal:#2F7A6F;--teal-soft:#DCEDE9;--coral:#C1503E;--coral-soft:#F5DEDA;--slate:#6B7280;--slate-soft:#E9E9EF;--line:#E6E0D2;}
  *{box-sizing:border-box;}
  .app-root{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--paper);color:var(--ink);min-height:600px;direction:rtl;font-size:14px;line-height:1.6;}
  .app-root h1,.app-root h2,.app-root h3,.brand,.tab-label{font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif;}
  .shell{display:flex;min-height:600px;}
  .sidebar{width:216px;background:var(--ink);color:#EDE9DC;padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;}
  .brand{font-weight:900;font-size:19px;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .brand-seal{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:12px;flex-shrink:0;}
  .role-tag{font-size:11px;color:var(--gold-soft);background:rgba(201,154,59,.18);display:inline-block;padding:2px 10px;border-radius:100px;margin-bottom:20px;width:fit-content;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:3px;cursor:pointer;color:#C9CADA;font-weight:500;font-size:13px;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--gold);color:var(--ink);font-weight:700;}
  .nav-spacer{flex:1;}
  .logout-btn{color:#C9CADA;font-size:12.5px;cursor:pointer;padding:8px 12px;border-top:1px solid rgba(255,255,255,.12);margin-top:8px;}
  .logout-btn:hover{color:#fff;}
  .main{flex:1;padding:26px 32px;overflow:auto;max-height:800px;}
  .page-title{font-size:22px;font-weight:900;margin-bottom:2px;}
  .page-sub{color:var(--slate);font-size:13px;margin-bottom:22px;}
  .grid{display:grid;gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat-num{font-size:26px;font-weight:900;color:var(--ink);}
  .stat-label{font-size:12.5px;color:var(--slate);margin-top:2px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .card-title{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .row{display:flex;align-items:center;gap:10px;}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
  .btn:hover{background:var(--ink-soft);}
  .btn-gold{background:var(--gold);color:var(--ink);}
  .btn-gold:hover{background:#B98A2E;}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-outline:hover{background:#F0EDE3;}
  .btn-danger{background:transparent;color:var(--coral);border:1px solid var(--coral-soft);}
  .btn-danger:hover{background:var(--coral-soft);}
  .btn-sm{padding:5px 11px;font-size:12px;border-radius:6px;}
  .btn-live{background:var(--coral);color:#fff;}
  .btn-live:hover{background:#A63F30;}
  input,select,textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  label{font-size:12.5px;color:var(--slate);font-weight:600;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:right;font-size:12px;color:var(--slate);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--line);}
  .pill{padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:700;display:inline-block;}
  .pill-teal{background:var(--teal-soft);color:var(--teal);}
  .pill-coral{background:var(--coral-soft);color:var(--coral);}
  .pill-gold{background:var(--gold-soft);color:#8a6a1f;}
  .pill-slate{background:var(--slate-soft);color:#4B5563;}
  .empty{text-align:center;color:var(--slate);padding:30px 10px;font-size:13px;border:1px dashed var(--line);border-radius:10px;}
  .seal{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold);font-size:14px;flex-shrink:0;}
  .tab-row{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
  .tab-label{padding:9px 13px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap;}
  .tab-label.active{color:var(--ink);border-bottom-color:var(--gold);}
  .course-strip{width:5px;border-radius:4px;background:var(--gold);align-self:stretch;}
  .login-wrap{min-height:600px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--ink) 0%,#262F52 100%);padding:30px;}
  .login-card{width:400px;background:var(--paper);border-radius:16px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .login-seal{width:52px;height:52px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink);font-size:16px;margin-bottom:14px;}
  .role-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px;}
  .role-opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--slate);background:#fff;}
  .role-opt.active{border-color:var(--gold);background:var(--gold-soft);color:#8a6a1f;}
  .muted{color:var(--slate);font-size:12.5px;}
  .qbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .link-btn{color:var(--teal);font-size:12.5px;font-weight:700;cursor:pointer;}
  .banner{border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;}
  .banner-live{background:var(--coral-soft);color:var(--coral);border:1px solid var(--coral);}
  .banner-reminder{background:var(--gold-soft);color:#8a6a1f;border:1px solid var(--gold);}
  .video-protect{position:relative;border-radius:10px;overflow:hidden;margin-bottom:10px;background:#000;}
  .watermark-overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;opacity:.4;transform:rotate(-16deg);font-size:12px;font-weight:800;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9);user-select:none;padding:10px;}
  .cert-page{background:#fff;border:10px double var(--gold);border-radius:14px;padding:50px 40px;text-align:center;max-width:640px;margin:0 auto;}
  .cert-seal{width:70px;height:70px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin:0 auto 16px;}
  @media print{.sidebar,.tab-row,.no-print{display:none !important;}.main{padding:0 !important;max-height:none !important;}}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D9D2BE;border-radius:8px;}
</style>

<div id="app" class="app-root"></div>

<script type="module">
import { initializeApp, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, writeBatch, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ====== الصق إعدادات Firebase هنا (Project settings ← Your apps ← Web app) ======
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_AUTH_DOMAIN",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_STORAGE_BUCKET",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};
// ================================================================================

(function(){
  const KEYS = {
    students:'platform:students', teachers:'platform:teachers', courses:'platform:courses',
    enrollments:'platform:enrollments', attendance:'platform:attendance', grades:'platform:grades',
    exams:'platform:exams', submissions:'platform:submissions', homework:'platform:homework',
    hwSubs:'platform:hwsubs', settings:'platform:settings', certificates:'platform:certificates',
    qbank:'platform:qbank', events:'platform:events'
  };
  const uid = () => Math.random().toString(36).slice(2,9);
  function normCode(c){ c=(c||'').trim().toUpperCase().replace(/\s+/g,''); if(/^\d{4,8}$/.test(c)) c='DR#'+c; return c; }
  function uiModal(inner){
    let o = document.getElementById('uiModal'); if(o) o.remove();
    o = document.createElement('div'); o.id = 'uiModal';
    o.style.cssText = 'position:fixed;inset:0;background:rgba(27,35,64,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;direction:rtl;';
    o.innerHTML = '<div style="background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:85vh;overflow:auto;">' + inner + '</div>';
    document.body.appendChild(o); return o;
  }
  function askConfirm(msg){
    return new Promise(res=>{
      const o = uiModal('<div style="font-weight:700;margin-bottom:16px;line-height:1.7;">'+esc(msg)+'</div><div style="display:flex;gap:8px;"><button class="btn btn-danger" id="uiYes" style="flex:1;">تأكيد</button><button class="btn btn-outline" id="uiNo" style="flex:1;">إلغاء</button></div>');
      o.querySelector('#uiYes').onclick = ()=>{ o.remove(); res(true); };
      o.querySelector('#uiNo').onclick = ()=>{ o.remove(); res(false); };
    });
  }
  function showText(title, text){
    const o = uiModal('<div style="font-weight:700;margin-bottom:10px;">'+esc(title)+'</div><textarea readonly rows="6" style="margin-bottom:12px;">'+esc(text)+'</textarea><button class="btn btn-gold" id="uiOk" style="width:100%;">تمام</button>');
    const ta = o.querySelector('textarea'); ta.focus(); ta.select();
    o.querySelector('#uiOk').onclick = ()=>o.remove();
  }
  function toast(msg){
    const o = uiModal('<div style="line-height:1.7;margin-bottom:14px;white-space:pre-wrap;">'+esc(msg)+'</div><button class="btn btn-gold" id="uiOk" style="width:100%;">تمام</button>');
    o.querySelector('#uiOk').onclick = ()=>o.remove();
  }
  window.alert = toast;
  function editModal(title, fields, onSave){
    const o = uiModal('<div style="font-weight:700;margin-bottom:12px;">'+esc(title)+'</div>' +
      fields.map(f=>'<div class="field"><label>'+esc(f.label)+'</label><input id="em_'+f.id+'" type="'+(f.type||'text')+'" value="'+esc(f.value==null?'':String(f.value))+'" /></div>').join('') +
      '<div style="display:flex;gap:8px;"><button class="btn btn-gold" id="emSave" style="flex:1;">حفظ</button><button class="btn btn-outline" id="emCancel" style="flex:1;">إلغاء</button></div>');
    o.querySelector('#emCancel').onclick = ()=>o.remove();
    o.querySelector('#emSave').onclick = async ()=>{
      const vals = {}; fields.forEach(f=>{ vals[f.id] = o.querySelector('#em_'+f.id).value.trim(); });
      o.remove(); await onSave(vals);
    };
  }
  function fmtDT(v){ return v ? v.replace('T',' ') : ''; }
  const APP_URL = location.href.split('#')[0];
  async function hashPass(p){ try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dracademy:'+p)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'p:'+p; } }
  const studentCode = (id) => 'ST-' + id.slice(0,5).toUpperCase();

  let DB = { students:[], teachers:[], courses:[], enrollments:[], attendance:[], grades:[], exams:[], submissions:[], homework:[], hwSubs:[], certificates:[], qbank:[], events:[], codes:[], contacts:[] };
  let SETTINGS = { dailyApiKey:'' };
  let ME = null, route = 'dash', ctx = {}, loading = true;

  const DATA_COLLS = ['students','teachers','courses','enrollments','attendance','grades','exams','submissions','homework','hwSubs','certificates','qbank','events'];
  const IDF = { enrollments:o=>o.courseId+'_'+o.studentId, attendance:o=>o.courseId+'_'+o.date, submissions:o=>o.examId+'_'+o.studentId, hwSubs:o=>o.hwId+'_'+o.studentId };
  const docIdOf = (name,o) => IDF[name] ? IDF[name](o) : o.id;
  const KEY2COLL = {}; DATA_COLLS.forEach(n=>{ KEY2COLL[KEYS[n]] = n; });
  let SYNC = {}, fb = {}, unsubs = [], READY = false;
  const codeToEmail = c => normCode(c).toLowerCase().replace('#','') + '@dracademy.app';
  function configured(){ return firebaseConfig.apiKey && !/PASTE/i.test(firebaseConfig.apiKey); }

  async function saveShared(key, arr){
    const name = KEY2COLL[key]; if(!name) return;
    const prev = SYNC[name] || {}, next = {};
    arr.forEach(o=>{ next[docIdOf(name,o)] = JSON.stringify(o); });
    const batch = writeBatch(fb.db); let n = 0;
    Object.keys(next).forEach(id=>{ if(prev[id] !== next[id]){ batch.set(doc(fb.db,name,id), JSON.parse(next[id])); n++; } });
    Object.keys(prev).forEach(id=>{ if(!(id in next)){ batch.delete(doc(fb.db,name,id)); n++; } });
    SYNC[name] = next;
    if(n){ try{ await batch.commit(); }catch(e){ console.error(e); alert('تعذر الحفظ. ممكن ليس لديك صلاحية لهذا الإجراء أو الاتصال ضعيف.'); } }
  }
  async function saveSettingsObj(){}

  function softRender(){
    const a = document.activeElement;
    const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if(typing || document.getElementById('uiModal')) return;
    if(route==='studentExams' && ctx.takeExam) return;
    render();
  }
  function stopListeners(){ unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs = []; }
  function listen(name, q, onDone){
    let first = true;
    const un = onSnapshot(q, snap=>{
      const arr = [], sync = {};
      snap.forEach(d=>{ const o = d.data(); arr.push(o); sync[d.id] = JSON.stringify(o); });
      DB[name] = arr; SYNC[name] = sync;
      if(first){ first = false; onDone(); } else if(READY) softRender();
    }, err=>{ console.error(name, err); if(first){ first = false; onDone(); } });
    unsubs.push(un);
  }
  async function enter(u){
    const r = await getDoc(doc(fb.db,'roles',u.uid));
    if(!r.exists()){ await signOut(fb.auth); alert('الحساب غير مفعّل. تواصل مع إدارة السنتر.'); return; }
    const info = r.data(), role = info.role, me = info.userId;
    stopListeners(); READY = false; loading = true; render();
    const jobs = [];
    const C = n => collection(fb.db, n);
    const add = (name, q) => jobs.push(new Promise(res=>listen(name, q, res)));
    if(role==='admin' || role==='teacher'){
      DATA_COLLS.forEach(n=>add(n, C(n)));
      add('contacts', C('contacts'));
      if(role==='admin') add('codes', C('codes'));
    } else {
      ['courses','exams','homework','events','attendance'].forEach(n=>add(n, C(n)));
      ['enrollments','grades','submissions','hwSubs','certificates'].forEach(n=>add(n, query(C(n), where('studentId','==',me))));
      DB.qbank = []; DB.teachers = [];
      jobs.push(getDoc(doc(fb.db,'students',me)).then(d=>{ DB.students = d.exists() ? [d.data()] : []; }));
    }
    await Promise.all(jobs);
    READY = true;
    let code = ''; try{ code = localStorage.getItem('dr_code') || ''; }catch(e){}
    if(role==='admin') ME = { id:'admin', name:'الإدارة', role:'admin' };
    else {
      const list = role==='student' ? DB.students : DB.teachers;
      const user = list.find(x=>x.id===me);
      if(!user){ await signOut(fb.auth); alert('بيانات الحساب غير موجودة.'); return; }
      ME = {...user, role, code};
    }
    let parent = false; try{ parent = localStorage.getItem('dr_parent') === '1'; }catch(e){}
    if(parent && role==='student'){ route = 'parentReport'; ctx = {studentId: ME.id}; } else { route = 'dash'; ctx = {}; }
    loading = false; render();
  }
  function boot(){
    if(!configured()){
      document.getElementById('app').innerHTML = '<div style="padding:40px;max-width:560px;margin:0 auto;line-height:1.9;"><h2>الإعداد مطلوب</h2><p>افتح الملف وابحث عن <b>firebaseConfig</b> في أول السكربت، والصق إعدادات مشروع Firebase مكان كلمات PASTE.</p></div>';
      return;
    }
    const app = initializeApp(firebaseConfig);
    fb.app = app; fb.auth = getAuth(app); fb.db = getFirestore(app);
    onAuthStateChanged(fb.auth, u=>{
      if(u){ enter(u); }
      else { stopListeners(); READY = false; ME = null; loading = false; route = 'dash'; ctx = {}; render(); }
    });
  }
  async function signInCode(raw){
    const c = normCode(raw);
    if(!c){ alert('اكتب الكود'); return false; }
    try{
      await signInWithEmailAndPassword(fb.auth, codeToEmail(c), c);
      try{ localStorage.setItem('dr_code', c.replace(/^DR#/,'Dr#')); }catch(e){}
      return true;
    }catch(e){ alert('الكود غير صحيح. تأكد منه مع إدارة السنتر.'); return false; }
  }

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function go(r, c){ route = r; ctx = c || {}; render(); }
  window.__go = go;

  // ---------- LOGIN ----------
  function roleTabs(active){
    const t=(k,l)=>`<div class="role-opt ${active===k?'active':''}" onclick="__go('login',{pickedRole:'${k}'})">${l}</div>`;
    return `<div class="role-pick" style="grid-template-columns:repeat(3,1fr);">${t('code','طالب / مدرس')}${t('parent','ولي أمر')}${t('admin','إدارة')}</div>`;
  }
  function renderLogin(){
    const el = document.getElementById('app');
    const picked = ctx.pickedRole || 'code';
    let body = '';
    if(picked==='code'){
      body = `<p class="muted" style="margin-bottom:16px;">اكتب الكود اللي وصلك من إدارة السنتر</p>
        <div class="field"><label>كود الدخول</label><input id="loginCode" placeholder="مثال: Dr#482915" onkeydown="if(event.key==='Enter')__doLogin('code')" /></div>
        <button class="btn btn-gold" style="width:100%;padding:11px;" onclick="__doLogin('code')">دخول</button>`;
    } else if(picked==='parent'){
      body = `<p class="muted" style="margin-bottom:16px;">بوابة ولي الأمر — اكتب كود ابنك لمتابعة الحضور والدرجات</p>
        <div class="field"><label>كود الطالب</label><input id="parentCode" placeholder="مثال: Dr#482915" onkeydown="if(event.key==='Enter')__viewParentReport()" /></div>
        <button class="btn btn-gold" style="width:100%;padding:11px;" onclick="__viewParentReport()">عرض التقرير</button>`;
    } else {
      body = `<p class="muted" style="margin-bottom:16px;">دخول إدارة السنتر</p>
        <div class="field"><label>البريد الإلكتروني للإدارة</label><input id="loginEmail" type="email" placeholder="admin@example.com" /></div>
        <div class="field"><label>كلمة مرور الإدارة</label><input id="loginPass" type="password" placeholder="••••" onkeydown="if(event.key==='Enter')__doLogin('admin')" /></div>
        <button class="btn btn-gold" style="width:100%;padding:11px;" onclick="__doLogin('admin')">دخول</button>`;
    }
    el.innerHTML = `<div class="login-wrap"><div class="login-card">
      <div class="login-seal">DA</div>
      <h1 style="font-size:20px;font-weight:900;margin-bottom:4px;">Dr Academy</h1>
      ${roleTabs(picked)}${body}
    </div></div>`;
  }

  window.__viewParentReport = async function(){
    try{ localStorage.setItem('dr_parent','1'); }catch(e){}
    const ok = await signInCode(document.getElementById('parentCode').value);
    if(!ok){ try{ localStorage.removeItem('dr_parent'); }catch(e){} }
  };
  window.__doLogin = async function(role){
    try{ localStorage.removeItem('dr_parent'); }catch(e){}
    if(role==='admin'){
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      if(!email || !pass){ alert('اكتب البريد وكلمة المرور'); return; }
      try{ await signInWithEmailAndPassword(fb.auth, email, pass); }
      catch(e){ alert('بيانات دخول الإدارة غير صحيحة'); }
      return;
    }
    await signInCode(document.getElementById('loginCode').value);
  };
  window.__logout = async function(){
    try{ localStorage.removeItem('dr_parent'); localStorage.removeItem('dr_code'); }catch(e){}
    ctx = {}; route = 'login';
    try{ await signOut(fb.auth); }catch(e){}
  };

  // ---------- HELPERS ----------
  function buildReportText(studentId){
    const student = DB.students.find(s=>s.id===studentId);
    if(!student) return '';
    const att = DB.attendance.flatMap(a=>a.records.filter(r=>r.studentId===studentId));
    const present = att.filter(r=>r.status==='present').length;
    const grades = DB.grades.filter(g=>g.studentId===studentId);
    const avg = grades.length ? Math.round(grades.reduce((a,g)=>a+(g.score/g.max*100),0)/grades.length) : null;
    let t = 'تقرير Dr Academy\nالطالب: ' + student.name + '\nالحضور: ' + present + ' من ' + att.length + ' جلسة\n';
    t += (avg!==null ? 'المعدل العام: ' + avg + '%\n' : 'لا يوجد درجات مسجلة بعد\n');
    if(grades.length){ t += 'آخر الدرجات:\n'; grades.slice(-3).forEach(g => { t += '- ' + g.title + ': ' + g.score + '/' + g.max + '\n'; }); }
    return t;
  }

  function calcPoints(studentId){

    batch.set(doc(fb.db,'roles',authUid), {role:kind, userId:id});

  window.__editUser = function(kind, id){
    const list = kind==='student' ? DB.students : DB.teachers;
    const u = list.find(x=>x.id===id); if(!u) return;
    editModal('تعديل البيانات (الكود لا يتغير)', [{id:'name',label:'الاسم',value:u.name},{id:'phone',label:'رقم واتساب',value:phoneOf(id)}], async v=>{

      const batch = writeBatch(fb.db);
      batch.set(doc(fb.db, kind==='student'?'students':'teachers', id), {id, name:v.name});
      batch.set(doc(fb.db,'contacts',id), {userId:id, phone:v.phone});
      try{ await batch.commit(); }catch(e){ alert('تعذر الحفظ'); return; }
      if(kind==='teacher'){ DB.courses.forEach(c=>{ if(c.teacherId===id) c.teacherName = v.name; }); await saveShared(KEYS.courses, DB.courses); }

  window.__regenCode = async function(kind, id){
    const old = DB.codes.find(x=>x.userId===id);
    if(old && !(await askConfirm('الكود القديم هيبطل يشتغل. متأكد؟'))) return;
    const code = genCode(); let authUid;
    try{ authUid = await makeAuth(code); }catch(e){ alert('تعذر إنشاء الكود: ' + (e.code || e.message)); return; }
    const batch = writeBatch(fb.db);
    batch.set(doc(fb.db,'codes',id), {userId:id, kind, code, authUid});
    batch.set(doc(fb.db,'roles',authUid), {role:kind, userId:id});
    if(old && old.authUid) batch.delete(doc(fb.db,'roles',old.authUid));
    try{ await batch.commit(); }catch(e){ alert('تعذر الحفظ: ' + e.message); }
  };
  window.__removeUser = async function(kind, id){
    if(!(await askConfirm('حذف نهائياً؟'))) return;
    const old = DB.codes.find(x=>x.userId===id);
    const batch = writeBatch(fb.db);
    batch.delete(doc(fb.db, kind==='student'?'students':'teachers', id));
    batch.delete(doc(fb.db,'contacts',id));
    batch.delete(doc(fb.db,'codes',id));
    if(old && old.authUid) batch.delete(doc(fb.db,'roles',old.authUid));
    if(kind==='student') DB.enrollments.filter(e=>e.studentId===id).forEach(e=>batch.delete(doc(fb.db,'enrollments',e.courseId+'_'+e.studentId)));
    try{ await batch.commit(); }catch(e){ alert('تعذر الحذف: ' + e.message); }
  };

  function renderCalendar(){
    const courses = ME.role==='teacher' ? DB.courses.filter(c=>c.teacherId===ME.id) : myCoursesOf(ME.id);
    const ids = courses.map(c=>c.id);
    const nameOf = id => { const c = courses.find(x=>x.id===id); return c ? c.name : ''; };

    DB.homework.filter(h=>ids.includes(h.courseId)).forEach(h=>items.push({date:h.due||'', type:'واجب', label:h.title, course:nameOf(h.courseId)}));
    DB.exams.filter(e=>ids.includes(e.courseId)).forEach(e=>items.push({date:e.scheduledDate||'', type:'امتحان', label:e.title, course:nameOf(e.courseId)}));
    DB.attendance.filter(a=>ids.includes(a.courseId)).forEach(a=>items.push({date:a.date, type:'جلسة حضور', label:'أخذ حضور', course:nameOf(a.courseId)}));
    DB.events.filter(ev=>ids.includes(ev.courseId)).forEach(ev=>items.push({date:ev.date, type:'موعد', label:ev.title, course:nameOf(ev.courseId), eventId:ev.id}));

  window.__saveAttendance = async function(courseId){

  window.__editAttendance = function(courseId, date){

    const o = uiModal('<div style="font-weight:700;margin-bottom:10px;">تعديل حضور '+esc(date)+'</div>'+rows+'<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-gold" id="emSave" style="flex:1;">حفظ</button><button class="btn btn-outline" id="emCancel" style="flex:1;">إلغاء</button></div>');
    o.querySelector('#emCancel').onclick = ()=>o.remove();
    o.querySelector('#emSave').onclick = async ()=>{
      o.querySelectorAll('select[data-sid]').forEach(sel=>{ const r = sess.records.find(x=>x.studentId===sel.getAttribute('data-sid')); if(r) r.status = sel.value; });

    DB.attendance = DB.attendance.filter(a=>!(a.courseId===courseId && a.date===date));
    await saveShared(KEYS.attendance, DB.attendance); render();
  };

  window.__saveExam = async function(courseId, qCount){
    const title = document.getElementById('examTitle').value.trim();
    const scheduledDate = document.getElementById('examDate').value;
    const durationMin = Number(document.getElementById('examDur').value) || 0;
    const opensAt = document.getElementById('examOpen').value;
    const closesAt = document.getElementById('examClose').value;
    if(!title){ alert('اكتب عنوان الامتحان'); return; }
    if(opensAt && closesAt && new Date(closesAt) <= new Date(opensAt)){ alert('وقت الإغلاق لازم يكون بعد وقت الفتح'); return; }
    let questions = [];
    document.querySelectorAll('.bankq:checked').forEach(cb=>{ const bq = DB.qbank.find(q=>q.id===cb.value); if(bq) questions.push({text:bq.text, options:bq.options, correct:bq.correct}); });

      if(u.hostname.includes('youtube.com')){

      if(u.hostname.includes('vimeo.com')) return 'https://player.vimeo.com/video/'+u.pathname.split('/').filter(Boolean).pop();

  function examState(e){
    const now = Date.now();
    const o = e.opensAt ? new Date(e.opensAt).getTime() : 0;
    const c = e.closesAt ? new Date(e.closesAt).getTime() : Infinity;
    return now < o ? 'soon' : now > c ? 'closed' : 'open';
  }
  function examStartKey(examId){ return 'dr_exam_start_'+examId+'_'+(ME?ME.id:''); }
  function examDeadline(e){
    let start = Date.now();
    try{ const v = localStorage.getItem(examStartKey(e.id)); if(v) start = Number(v); }catch(err){}
    const byDur = e.durationMin ? start + e.durationMin*60000 : Infinity;
    const byClose = e.closesAt ? new Date(e.closesAt).getTime() : Infinity;
    return Math.min(byDur, byClose);
  }
  function startExamTimer(){
    const e = DB.exams.find(x=>x.id===ctx.takeExam); const el = document.getElementById('examTimer');
    if(!e || !el) return;
    const deadline = examDeadline(e);
    if(deadline === Infinity){ el.style.display = 'none'; return; }
    const tick = ()=>{
      const left = Math.max(0, Math.round((deadline - Date.now())/1000));
      const m = String(Math.floor(left/60)).padStart(2,'0'), sec = String(left%60).padStart(2,'0');
      const node = document.getElementById('examTimer'); if(node) node.textContent = '⏱ الوقت المتبقي: ' + m + ':' + sec;
      if(left <= 0){ clearInterval(window.__examInt); window.__examInt = null; alert('انتهى الوقت وتم تسليم الامتحان'); window.__submitExam(e.id, e.questions.length); }
    };
    tick(); window.__examInt = setInterval(tick, 1000);
  }
  function renderStudentExams(){
    const courses = myCoursesOf(ME.id);
    const exams = DB.exams.filter(e=>courses.some(c=>c.id===e.courseId));
    if(ctx.takeExam){
      const exam = exams.find(e=>e.id===ctx.takeExam);
      if(!exam) return pageHeader('الامتحان غير متاح','') + `<button class="btn btn-outline" onclick="__go('studentExams')">رجوع</button>`;
      const already = DB.submissions.find(s=>s.examId===exam.id && s.studentId===ME.id);
      if(already) return pageHeader(esc(exam.title),'') + `<div class="card"><div class="card-title">لقد قدمت هذا الامتحان بالفعل</div><div class="seal" style="margin-bottom:10px;">${already.score}/${exam.questions.length}</div><div class="muted">درجتك: ${already.score} من ${exam.questions.length}</div></div><button class="btn btn-outline" style="margin-top:10px;" onclick="__go('studentExams')">رجوع</button>`;
      const st = examState(exam);
      if(st !== 'open') return pageHeader(esc(exam.title),'') + `<div class="card"><div class="empty">${st==='soon' ? 'الامتحان لسه ما بدأش. يفتح في '+fmtDT(exam.opensAt) : 'انتهى وقت هذا الامتحان.'}</div></div><button class="btn btn-outline" onclick="__go('studentExams')">رجوع</button>`;
      try{ if(!localStorage.getItem(examStartKey(exam.id))) localStorage.setItem(examStartKey(exam.id), String(Date.now())); }catch(err){}
      return pageHeader(esc(exam.title),'أجب على كل الأسئلة ثم اضغط تسليم') + `<div class="banner banner-reminder" id="examTimer"></div><div class="card">
        ${exam.questions.map((q,i)=>`<div class="qbox"><div style="font-weight:700;margin-bottom:8px;">${i+1}. ${esc(q.text)}</div>${q.options.map((o,oi)=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--ink);margin-bottom:6px;"><input type="radio" name="ans_${i}" value="${oi}" style="width:auto;" /> ${esc(o)}</label>`).join('')}</div>`).join('')}
        <button class="btn btn-gold" onclick="__submitExam('${exam.id}', ${exam.questions.length})">تسليم الامتحان</button></div>`;

      exams.map(e=>{
        const done = DB.submissions.find(s=>s.examId===e.id && s.studentId===ME.id);
        const c = courses.find(x=>x.id===e.courseId);
        const st = examState(e);
        const action = done ? `<span class="pill pill-teal">تم: ${done.score}/${e.questions.length}</span>` :
          st==='soon' ? `<span class="pill pill-gold">يفتح ${fmtDT(e.opensAt)}</span>` :
          st==='closed' ? `<span class="pill pill-coral">انتهى</span>` :
          `<button class="btn btn-sm btn-gold" onclick="__go('studentExams',{takeExam:'${e.id}'})">ابدأ الامتحان</button>`;
        return `<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);"><div style="flex:1;"><div style="font-weight:700;">${esc(e.title)}</div><div class="muted">${esc(c?c.name:'')} · ${e.questions.length} سؤال ${e.durationMin?'· '+e.durationMin+' دقيقة':''} ${e.scheduledDate?'· '+e.scheduledDate:''}</div></div>${action}</div>`;
      }).join('')}</div>`;

  window.__submitExam = async function(examId, qCount){
    const exam = DB.exams.find(e=>e.id===examId); if(!exam) return;
    if(DB.submissions.find(s=>s.examId===examId && s.studentId===ME.id)) return;
    const closes = exam.closesAt ? new Date(exam.closesAt).getTime() : Infinity;
    if(Date.now() > closes + 20000){ alert('انتهى وقت الامتحان'); ctx = {}; render(); return; }
    let score = 0; const answers = [];
    for(let i=0;i<qCount;i++){
      const sel = document.querySelector('input[name="ans_'+i+'"]:checked');
      const val = sel ? Number(sel.value) : -1; answers.push(val);
      if(val === exam.questions[i].correct) score++;
    }
    DB.submissions.push({examId, studentId:ME.id, answers, score, submittedAt:Date.now()});
    await saveShared(KEYS.submissions, DB.submissions);
    ctx = {takeExam:examId}; render();
  };

  window.__submitHw = async function(hwId){
    const content = document.getElementById('hwAns_'+hwId).value.trim();
    if(!content){ alert('اكتب إجابتك قبل التسليم'); return; }
    DB.hwSubs.push({hwId, studentId:ME.id, content, grade:null, submittedAt:Date.now()});
    await saveShared(KEYS.hwSubs, DB.hwSubs); render();
  };
  function renderStudentCertificates(){
    const certs = DB.certificates.filter(c=>c.studentId===ME.id);
    if(ctx.certId){
      const cert = certs.find(c=>c.id===ctx.certId);
      if(!cert) return pageHeader('الشهادة غير موجودة','');
      return `<div class="no-print" style="margin-bottom:14px;"><span class="link-btn" onclick="__go('studentCertificates')">رجوع</span></div>
        <div class="cert-page"><div class="cert-seal">DA</div>
          <div style="font-size:12px;letter-spacing:2px;color:var(--slate);margin-bottom:8px;">Dr Academy</div>
          <h1 style="font-size:24px;font-weight:900;margin-bottom:18px;">شهادة إتمام</h1>
          <div style="font-size:14px;color:var(--slate);margin-bottom:6px;">تشهد منصة Dr Academy بأن الطالب</div>
          <div style="font-size:22px;font-weight:900;color:var(--gold);margin-bottom:10px;">${esc(cert.studentName)}</div>
          <div style="font-size:14px;color:var(--slate);margin-bottom:6px;">قد أتم بنجاح كورس</div>
          <div style="font-size:18px;font-weight:800;margin-bottom:16px;">${esc(cert.courseName)}</div>
          <div class="muted">بتاريخ ${new Date(cert.issuedAt).toLocaleDateString('ar-EG')}</div></div>
        <div class="no-print" style="text-align:center;margin-top:20px;"><button class="btn btn-gold" onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div>`;
    }
    return pageHeader('شهاداتي','') + `<div class="card">${certs.length===0 ? '<div class="empty">لسه معندكش شهادات. هتظهر هنا أول ما المدرس يصدرها.</div>' :
      certs.map(c=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);"><div style="flex:1;"><div style="font-weight:700;">${esc(c.courseName)}</div><div class="muted">${new Date(c.issuedAt).toLocaleDateString('ar-EG')}</div></div><button class="btn btn-sm btn-gold" onclick="__go('studentCertificates',{certId:'${c.id}'})">عرض وطباعة</button></div>`).join('')}</div>`;
  }

  // ---------- ROUTER ----------
  function render(){
    if(window.__examInt){ clearInterval(window.__examInt); window.__examInt = null; }
    if(loading){ document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:#6B7280;">جاري التحميل...</div>'; return; }
    if(route==='parentReport'){ renderParentReport(); return; }
    if(!ME){ renderLogin(); if(false){ const c=document.querySelector('.login-card'); if(c) c.insertAdjacentHTML('afterbegin','<div class="banner banner-live">⚠️ التخزين المشترك غير متاح. افتح الرابط وانت مسجل دخول في Claude.</div>'); } return; }
    let inner = '';
    if(ME.role==='admin'){
      inner = route==='manageTeachers' ? renderManageTeachers() : route==='manageStudents' ? renderManageStudents() : route==='manageCourses' ? renderManageCourses() : route==='adminEnroll' ? renderAdminEnroll() : renderAdminDash();
    } else if(ME.role==='teacher'){
      inner = route==='myCourses' ? renderMyCourses() : route==='teacherCourse' ? renderTeacherCourse() : route==='calendar' ? renderCalendar() : renderTeacherDash();
    } else {
      inner = route==='studentCourses' ? renderStudentCourses() : route==='studentAttendance' ? renderStudentAttendance() : route==='studentGrades' ? renderStudentGrades() : route==='studentExams' ? renderStudentExams() : route==='studentHomework' ? renderStudentHomework() : route==='studentCertificates' ? renderStudentCertificates() : route==='calendar' ? renderCalendar() : renderStudentDash();
    }
    renderShell(inner);
    if(ME.role==='student' && route==='studentExams' && ctx.takeExam) startExamTimer();
  }

  boot();
})();
</script>

  @media(max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px;}
    .sidebar .brand,.sidebar .role-tag{width:100%;margin-bottom:4px;}
    .nav-spacer{display:none;}
    .nav-item{padding:7px 10px;}
    .main{padding:18px 14px;max-height:none;}
    .grid-3,.grid-2{grid-template-columns:1fr;}
    .login-card{width:100%;}
  }
</style>
